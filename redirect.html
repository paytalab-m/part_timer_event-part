<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FFECB3">
  <title>신청 페이지로 이동합니다</title>

  <!-- Pretendard 폰트 -->
  <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --accent: #FF6B00;
      --accent-faded: #FFE9D6;
      --text-900: #2A2A2A;
      --text-500: #6B6B6B;
    }

    html, body {
      font-family: 'Pretendard Variable', 'Pretendard', -apple-system, sans-serif;
      letter-spacing: -0.02em;
      color: var(--text-900);
      background: #FFECB3;
      height: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #FFFFFF;
      border-radius: 24px;
      padding: 36px 28px 32px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 0 12px 32px rgba(255, 143, 0, 0.20);
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .icon-wrap {
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
      background: var(--accent-faded);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .icon-wrap svg { width: 36px; height: 36px; }
    .icon-wrap::after {
      content: '';
      position: absolute;
      inset: -6px;
      border: 2px solid var(--accent);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 1.2s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    h1 {
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 12px;
      letter-spacing: -0.025em;
    }

    p {
      font-size: 14px;
      color: var(--text-500);
      line-height: 1.7;
      margin-bottom: 22px;
    }
    p strong {
      color: var(--accent);
      font-weight: 700;
    }

    .countdown-box {
      background: #FFF6E0;
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 18px;
      font-size: 13.5px;
      color: var(--text-900);
      font-weight: 600;
    }
    .countdown-box strong {
      color: var(--accent);
      font-size: 17px;
      font-weight: 900;
      margin: 0 3px;
    }

    .go-now-btn {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: -0.02em;
      box-shadow: 0 4px 12px rgba(255, 107, 0, 0.25);
    }
    .go-now-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#FF6B00" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12 L19 12"/>
        <path d="M13 6 L19 12 L13 18"/>
      </svg>
    </div>

    <h1>신청 페이지로 이동합니다</h1>

    <p>
      신청 후에, 꼭 가이드를 확인하여<br>
      <strong>참여자 등록까지 마무리</strong>해 주세요!
    </p>

    <div class="countdown-box">
      <strong id="countdown-num">6</strong>초 후 자동으로 이동합니다
    </div>

    <button type="button" class="go-now-btn" id="go-now-btn">바로 이동하기</button>
  </div>

  <script>
    (function() {
      // URL 파라미터에서 next 받음, 없으면 기본값
      const params = new URLSearchParams(window.location.search);
      const nextUrl = params.get('next') || 'https://passorder.kr/Oa8B0jHM';

      const countdownEl = document.getElementById('countdown-num');
      const goNowBtn = document.getElementById('go-now-btn');

      function goNow() {
        try {
          if (window.top && window.top !== window.self) {
            window.top.location.href = nextUrl;
          } else {
            window.location.href = nextUrl;
          }
        } catch (e) {
          window.location.href = nextUrl;
        }
      }

      // 6초 카운트다운
      let n = 6;
      countdownEl.textContent = n;
      const timer = setInterval(() => {
        n -= 1;
        countdownEl.textContent = n;
        if (n <= 0) {
          clearInterval(timer);
          goNow();
        }
      }, 1000);

      // "바로 이동하기" 클릭 → 즉시 이동
      goNowBtn.addEventListener('click', () => {
        clearInterval(timer);
        goNow();
      });
    })();
  </script>
</body>
</html>
